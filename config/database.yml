# Database configuration
# SQLite for local development and testing
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# PostgreSQL for production
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  database: <%= ENV["DB_dbname"] || ENV.fetch("POSTGRES_DB", "chuck_norris_production") %>
  username: <%= ENV["DB_username"] || ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV["DB_password"] || ENV.fetch("POSTGRES_PASSWORD", "") %>
  host: <%= ENV["DB_host"] || ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV["DB_port"] || ENV.fetch("POSTGRES_PORT", 5432) %>
  <% end %>


