<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="jungle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#jungle)"/>
  
  <!-- Mist & Jungle Trees -->
  <polygon points="50,0 70,220 30,220" fill="#022c22" opacity="0.6"/>
  <polygon points="120,0 145,220 95,220" fill="#065f46" opacity="0.5"/>
  <polygon points="520,0 540,220 500,220" fill="#022c22" opacity="0.6"/>
  <polygon points="450,0 470,220 430,220" fill="#065f46" opacity="0.5"/>

  <!-- Braddock Torso Rising Out of Water -->
  <g transform="translate(300, 190)">
    <!-- Head & Hair Bandana -->
    <circle cx="0" cy="-60" r="26" fill="#ca8a04"/>
    <path d="M-26,-70 Q0,-85 26,-70 L26,-62 Q0,-75 -26,-62 Z" fill="#dc2626"/>
    <!-- Bandana tails -->
    <path d="M-24,-65 Q-40,-50 -35,-35" stroke="#dc2626" stroke-width="5" fill="none"/>
    <!-- Beard -->
    <path d="M-20,-60 Q0,-35 20,-60" fill="#78350f"/>
    <!-- Intense Eyes -->
    <circle cx="-8" cy="-64" r="2.5" fill="#020617"/>
    <circle cx="8" cy="-64" r="2.5" fill="#020617"/>
    <!-- Muscular Shoulders -->
    <path d="M-80,0 Q-40,-40 0,-30 Q40,-40 80,0 L90,60 L-90,60 Z" fill="#042f2e"/>
    <path d="M-60,0 Q0,-15 60,0 L70,50 L-70,50 Z" fill="#b45309"/>
    <!-- Ammo Belts crossed -->
    <line x1="-50" y1="0" x2="50" y2="50" stroke="#facc15" stroke-width="8" stroke-dasharray="4,3"/>
    <line x1="50" y1="0" x2="-50" y2="50" stroke="#facc15" stroke-width="8" stroke-dasharray="4,3"/>
    <!-- M60 Heavy Machine Gun -->
    <rect x="-10" y="-10" width="160" height="20" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="70" y="-18" width="20" height="10" fill="#334155"/>
    <polygon points="150,-10 180,-20 180,0" fill="#f59e0b"/>
  </g>

  <!-- Water Surface & Splashes -->
  <path d="M0,240 Q150,225 300,240 T600,240 L600,360 L0,360 Z" fill="url(#water)"/>
  <ellipse cx="300" cy="245" rx="140" ry="15" fill="#5eead4" opacity="0.4"/>
  <path d="M220,240 Q250,190 280,240 M320,240 Q350,185 380,240" stroke="#ccfbf1" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Badge -->
  <rect x="20" y="20" width="220" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#2dd4bf" letter-spacing="1">MISSING IN ACTION</text>
  <text x="310" y="335" font-family="Impact, sans-serif" font-size="16" fill="#5eead4">SLOW-MOTION SWAMP ERUPTION</text>
</svg>
