<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="city" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#city)"/>
  
  <!-- Chicago Skyline Silhouette -->
  <polygon points="50,140 80,140 80,300 50,300" fill="#0f172a"/>
  <polygon points="100,100 140,100 140,300 100,300" fill="#1e293b"/>
  <polygon points="160,80 180,80 180,300 160,300" fill="#0f172a"/>
  <polygon points="420,110 460,110 460,300 420,300" fill="#1e293b"/>
  <polygon points="480,130 520,130 520,300 480,300" fill="#0f172a"/>

  <!-- Prowler Robot Combat Unit -->
  <g transform="translate(180, 200)">
    <rect x="0" y="20" width="70" height="40" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="20" cy="70" r="16" fill="#020617" stroke="#64748b" stroke-width="4"/>
    <circle cx="50" cy="70" r="16" fill="#020617" stroke="#64748b" stroke-width="4"/>
    <rect x="50" y="30" width="40" height="8" fill="#1e293b"/>
    <circle cx="35" cy="30" r="6" fill="#ef4444"/>
  </g>

  <!-- Eddie Cusack (Chuck Norris) standing with badge and shotgun -->
  <g transform="translate(360, 160)">
    <circle cx="25" cy="-20" r="20" fill="#d97706"/>
    <path d="M12,-20 Q25,-2 38,-20" fill="#78350f"/>
    <!-- Detective trenchcoat -->
    <path d="M0,0 L50,0 L60,130 L-10,130 Z" fill="#64748b"/>
    <!-- Police Badge glow -->
    <polygon points="25,25 30,35 40,35 32,42 35,52 25,46 15,52 18,42 10,35 20,35" fill="#facc15"/>
    <line x1="30" y1="10" x2="80" y2="70" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="200" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#e2e8f0" letter-spacing="1">CODE OF SILENCE</text>
  <text x="320" y="335" font-family="Impact, sans-serif" font-size="16" fill="#cbd5e1">ONE MAN. ONE ROBOT. ZERO FEAR.</text>
</svg>
