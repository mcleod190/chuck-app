<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nightsky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#nightsky)"/>

  <!-- Broken window glass shards -->
  <polygon points="120,40 140,80 110,90" fill="#93c5fd" opacity="0.6"/>
  <polygon points="160,20 180,60 150,70" fill="#bfdbfe" opacity="0.7"/>
  <polygon points="100,120 130,150 90,160" fill="#60a5fa" opacity="0.5"/>
  <polygon points="200,80 230,120 190,130" fill="#93c5fd" opacity="0.6"/>

  <!-- Motorcycle Soaring Mid-Air -->
  <g transform="translate(250, 150) rotate(-22)">
    <!-- Rear Wheel -->
    <circle cx="-60" cy="50" r="32" fill="#0f172a" stroke="#64748b" stroke-width="7"/>
    <!-- Front Wheel -->
    <circle cx="90" cy="50" r="32" fill="#0f172a" stroke="#64748b" stroke-width="7"/>
    <!-- Frame -->
    <path d="M-60,50 L0,20 L50,0 L90,50 M0,20 L30,50 L-30,50" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Twin Rocket Launchers on front fork -->
    <rect x="50" y="-12" width="60" height="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect x="50" y="4" width="60" height="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <!-- Rocket trail flames -->
    <polygon points="110,-6 190,-16 110,-2" fill="#f59e0b"/>
    <polygon points="110,10 190,20 110,14" fill="#ef4444"/>
    <circle cx="120" cy="-6" r="6" fill="#fef08a"/>
    <circle cx="120" cy="10" r="6" fill="#fef08a"/>

    <!-- Chuck riding (Major McCoy) -->
    <ellipse cx="20" cy="-20" rx="20" ry="14" fill="#0369a1"/>
    <!-- Head with sunglasses and open hair -->
    <circle cx="30" cy="-45" r="15" fill="#f59e0b"/>
    <path d="M20,-48 Q30,-60 42,-45" fill="#78350f"/>
    <!-- Beard -->
    <path d="M22,-44 Q30,-30 38,-44" fill="#451a03"/>
    <rect x="26" y="-47" width="10" height="4" fill="#000000"/>
    <!-- Arm on handlebar -->
    <path d="M20,-20 L50,-10" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="200" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#7dd3fc" letter-spacing="1">THE DELTA FORCE</text>
  <text x="320" y="335" font-family="Impact, sans-serif" font-size="16" fill="#38bdf8">ROCKET-POWERED MOTORCYCLE</text>
</svg>
