<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="temple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#temple)"/>
  
  <!-- Ancient Mayan/Aztec Temple Pyramid silhouette -->
  <polygon points="300,80 340,120 260,120" fill="#292524"/>
  <polygon points="260,120 370,180 230,180" fill="#1c1917"/>
  <polygon points="230,180 410,250 190,250" fill="#292524"/>
  <polygon points="190,250 460,330 140,330" fill="#1c1917"/>

  <!-- Torches & Golden Treasure Glow -->
  <circle cx="300" cy="70" r="30" fill="#facc15" opacity="0.6"/>
  <polygon points="300,50 310,70 290,70" fill="#ea580c"/>

  <!-- Max Donigan (Chuck) adventuring silhouette with Fedora & Machete -->
  <g transform="translate(420, 200)">
    <circle cx="15" cy="-20" r="16" fill="#d97706"/>
    <!-- Fedora -->
    <ellipse cx="15" cy="-28" rx="22" ry="6" fill="#451a03"/>
    <rect x="5" y="-38" width="20" height="12" fill="#451a03" rx="2"/>
    <path d="M5,-20 Q15,-6 25,-20" fill="#78350f"/>
    <!-- Body -->
    <rect x="0" y="0" width="30" height="70" fill="#78350f"/>
    <!-- Machete -->
    <path d="M-10,30 L-35,0 L-40,5" stroke="#f8fafc" stroke-width="5" fill="none"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="160" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#fbbf24" letter-spacing="1">FIREWALKER</text>
  <text x="310" y="335" font-family="Impact, sans-serif" font-size="16" fill="#fef08a">GOLD, TEMPLES & ROUNDHOUSES</text>
</svg>
