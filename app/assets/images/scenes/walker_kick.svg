<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="texassun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#texassun)"/>

  <!-- Texas Ranger Star in Background -->
  <g transform="translate(300, 170)" opacity="0.25">
    <circle cx="0" cy="0" r="130" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <polygon points="0,-120 35,-35 125,-35 55,20 80,105 0,55 -80,105 -55,20 -125,-35 -35,-35" fill="#f59e0b"/>
  </g>

  <!-- Roundhouse Kick Swoosh Arc -->
  <path d="M120,290 A180,180 0 0,1 480,120" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M140,295 A160,160 0 0,1 460,135" stroke="#ea580c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Cordell Walker Silhouette Roundhousing -->
  <g transform="translate(260, 200)">
    <!-- Standing Leg -->
    <path d="M-20,30 L-30,120" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
    <rect x="-42" y="115" width="25" height="12" rx="3" fill="#0f172a"/>

    <!-- Extended Roundhouse Leg -->
    <path d="M-10,20 L160,-60" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
    <!-- Cowboy Boot on Kicking Foot -->
    <path d="M150,-65 L175,-70 L178,-55 L155,-50 Z" fill="#78350f"/>

    <!-- Torso turned -->
    <path d="M-40,-40 L0,-30 L-10,30 L-40,20 Z" fill="#334155"/>
    <polygon points="-40,-40 -15,-70 5,-40" fill="#f8fafc"/>

    <!-- Cowboy Hat & Head -->
    <circle cx="-15" cy="-80" r="16" fill="#ca8a04"/>
    <!-- Beard -->
    <path d="M-25,-75 Q-15,-60 -5,-75" fill="#78350f"/>
    <!-- Stetson Cowboy Hat -->
    <path d="M-55,-85 Q-15,-105 25,-85" stroke="#1e293b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-35,-88 Q-15,-115 5,-88 Z" fill="#1e293b"/>
  </g>

  <!-- Impact Flash at foot tip -->
  <circle cx="430" cy="135" r="18" fill="#fef08a"/>
  <polygon points="430,110 435,130 455,135 435,140 430,160 425,140 405,135 425,130" fill="#ffffff"/>

  <!-- Badge -->
  <rect x="20" y="20" width="250" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#fef08a" letter-spacing="1">WALKER, TEXAS RANGER</text>
  <text x="330" y="335" font-family="Impact, sans-serif" font-size="16" fill="#fde047">ROUNDHOUSE SUPREMACY</text>
</svg>
