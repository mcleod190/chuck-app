<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="denim_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#denim_grad)"/>
  
  <!-- Bazooka smoke explosion behind -->
  <circle cx="150" cy="180" r="100" fill="#ea580c" opacity="0.4"/>
  <circle cx="170" cy="160" r="70" fill="#facc15" opacity="0.3"/>

  <!-- Matt Hunter Double Denim Silhouette -->
  <g transform="translate(300, 180)">
    <!-- Denim Shirt & Jacket -->
    <path d="M-60,-20 L60,-20 L75,130 L-75,130 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M-30,-20 L0,50 L30,-20" stroke="#1e40af" stroke-width="3" fill="none"/>
    <!-- Head & Beard -->
    <circle cx="0" cy="-60" r="24" fill="#d97706"/>
    <path d="M-18,-60 Q0,-35 18,-60" fill="#78350f"/>
    <!-- Intense gaze -->
    <circle cx="-8" cy="-65" r="2" fill="#000"/>
    <circle cx="8" cy="-65" r="2" fill="#000"/>
    <!-- Dual Shoulder Leather Holsters -->
    <path d="M-45,-20 L-20,70" stroke="#78350f" stroke-width="6"/>
    <path d="M45,-20 L20,70" stroke="#78350f" stroke-width="6"/>
    <!-- Dual Micro-Uzis -->
    <g transform="translate(-70, 30)">
      <rect x="0" y="0" width="40" height="20" fill="#020617"/>
      <rect x="15" y="20" width="10" height="25" fill="#1e293b"/>
      <rect x="35" y="5" width="20" height="6" fill="#475569"/>
    </g>
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="40" height="20" fill="#020617"/>
      <rect x="15" y="20" width="10" height="25" fill="#1e293b"/>
      <rect x="35" y="5" width="20" height="6" fill="#475569"/>
    </g>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="190" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#93c5fd" letter-spacing="1">INVASION U.S.A.</text>
  <text x="320" y="335" font-family="Impact, sans-serif" font-size="16" fill="#bfdbfe">"IT'S TIME TO DIE"</text>
</svg>
