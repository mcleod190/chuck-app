<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="inferno" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#inferno)"/>
  
  <!-- Demon seal & pentagram flames -->
  <circle cx="300" cy="180" r="100" stroke="#f87171" stroke-width="3" fill="none" opacity="0.4"/>
  <polygon points="300,90 325,160 395,160 340,205 360,270 300,230 240,270 260,205 205,160 275,160" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Shatter delivering an explosive punch -->
  <g transform="translate(180, 160)">
    <circle cx="20" cy="-20" r="18" fill="#d97706"/>
    <path d="M10,-20 Q20,-5 30,-20" fill="#78350f"/>
    <!-- Detective leather jacket -->
    <rect x="0" y="0" width="40" height="80" fill="#18181b"/>
    <!-- Arm punching forward with glowing holy fist -->
    <path d="M40,20 L120,20" stroke="#18181b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="125" cy="20" r="15" fill="#fef08a"/>
    <circle cx="125" cy="20" r="28" fill="#f59e0b" opacity="0.4"/>
  </g>

  <!-- Demon reeling back -->
  <g transform="translate(420, 140)">
    <circle cx="20" cy="0" r="22" fill="#7f1d1d"/>
    <polygon points="10,-20 15,-5 5,-5" fill="#dc2626"/>
    <polygon points="30,-20 35,-5 25,-5" fill="#dc2626"/>
    <rect x="0" y="22" width="40" height="70" fill="#450a0a"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="160" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#ef4444" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#fca5a5" letter-spacing="1">HELLBOUND</text>
  <text x="290" y="335" font-family="Impact, sans-serif" font-size="16" fill="#fecaca">TEXAS JUSTICE VS ANCIENT EVIL</text>
</svg>
