<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nightdeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#nightdeep)"/>
  
  <!-- Full Moon -->
  <circle cx="480" cy="100" r="60" fill="#fef08a" opacity="0.8"/>
  <circle cx="460" cy="90" r="15" fill="#fde047" opacity="0.4"/>

  <!-- Mine shaft & well -->
  <ellipse cx="300" cy="300" rx="90" ry="25" fill="#000000" stroke="#475569" stroke-width="6"/>

  <!-- Sheriff Stevens spinning roundhouse kick -->
  <g transform="translate(240, 190)">
    <circle cx="20" cy="-30" r="18" fill="#d97706"/>
    <path d="M10,-30 Q20,-12 30,-30" fill="#78350f"/>
    <!-- Sheriff star -->
    <polygon points="20,10 24,18 32,18 26,24 28,32 20,27 12,32 14,24 8,18 16,18" fill="#eab308"/>
    <!-- Kicking leg pointing towards well -->
    <path d="M10,40 L100,50" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    <rect x="95" y="42" width="20" height="15" fill="#0f172a" rx="2"/>
    <path d="M0,0 L15,40" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Villain falling into the deep well -->
  <g transform="translate(320, 250) rotate(45)">
    <rect x="0" y="0" width="18" height="40" fill="#450a0a"/>
    <circle cx="9" cy="-10" r="8" fill="#991b1b"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="180" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#a855f7" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#d8b4fe" letter-spacing="1">SILENT RAGE</text>
  <text x="310" y="335" font-family="Impact, sans-serif" font-size="16" fill="#c084fc">SCIENCE CREATED HIM. CHUCK ENDED HIM.</text>
</svg>
