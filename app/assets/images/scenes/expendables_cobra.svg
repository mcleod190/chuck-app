<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <circle cx="480" cy="180" r="160" fill="url(#blast)"/>
  
  <!-- Ground -->
  <path d="M0,300 Q150,290 300,310 T600,295 L600,360 L0,360 Z" fill="#0f172a"/>
  
  <!-- Tank silhouette explosion -->
  <polygon points="420,290 460,250 530,250 560,290" fill="#1e293b"/>
  <rect x="440" y="240" width="60" height="15" fill="#334155"/>
  <line x1="430" y1="245" x2="380" y2="235" stroke="#475569" stroke-width="6"/>

  <!-- Cobra on rock -->
  <path d="M120,330 C120,280 160,260 140,220 C130,200 150,190 160,210 C170,230 180,290 180,330" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="145" cy="205" rx="14" ry="10" fill="#15803d"/>
  <!-- Cobra defeated X eyes -->
  <text x="141" y="209" font-family="sans-serif" font-weight="900" font-size="11" fill="#fee2e2">x x</text>
  <text x="80" y="270" font-family="Impact, sans-serif" font-size="14" fill="#86efac" font-weight="bold">THE COBRA DIED</text>

  <!-- Booker / Chuck Hero Silhouette with aviators -->
  <path d="M260,330 L270,210 Q280,180 300,180 Q320,180 330,210 L340,330 Z" fill="#020617"/>
  <!-- Shoulders & Coat -->
  <path d="M240,230 Q300,210 360,230 L380,330 L220,330 Z" fill="#0f172a"/>
  <!-- Head & Aviators -->
  <circle cx="300" cy="155" r="28" fill="#d97706"/>
  <!-- Beard -->
  <path d="M280,155 Q300,195 320,155 Z" fill="#78350f"/>
  <path d="M285,150 Q300,165 315,150" stroke="#451a03" stroke-width="4" fill="none"/>
  <!-- Sunglasses -->
  <rect x="284" y="145" width="14" height="9" rx="2" fill="#020617"/>
  <rect x="302" y="145" width="14" height="9" rx="2" fill="#020617"/>
  <line x1="298" y1="148" x2="302" y2="148" stroke="#020617" stroke-width="2"/>
  <!-- Beret -->
  <path d="M272,142 Q300,120 335,135 Q310,132 280,140 Z" fill="#1e293b"/>

  <!-- Badge / Movie banner -->
  <rect x="20" y="20" width="230" height="42" rx="8" fill="#000000" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="35" y="47" font-family="Impact, sans-serif" font-size="18" fill="#fbbf24" letter-spacing="1">THE EXPENDABLES 2</text>
</svg>
